name: Release version

on:
  push:
    branches:
      - main
      - "push-action/**"

# All branches deploy to the same target, so run one at a time and never cancel a release halfway
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Before foonver so a failing test doesn't tag a release
      - name: Test
        run: npm test

      - name: Run foonver
        id: foonver
        uses: foonly/foonver@v1.2.0
        with:
          # Pin the binary too; it otherwise defaults to the latest release
          version: "v1.2.0"
          command: "auto"
          changelog: "true"
          push: "true"
          commit_suffix: "[skip ci]"

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}
